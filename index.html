<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
      background-image: url('1759536074379video.mp4');
      background-size: cover;   /* ajusta la imagen al área */
      background-position: center; /* centra la imagen */
      background-repeat: no-repeat;
      
    }
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-size: cover;   /* ajusta la imagen al área */
      background-position: center; /* centra la imagen */
      background-repeat: no-repeat;
    }



    .contenido {
      color: white;
      font-size: 2.5em;
      font-family: "UnifrakturCook", serif;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 0 0 12px black;
    }

    .btn {
      font-family: "UnifrakturCook", serif;
      font-size: 1.8em;
      color: #f5e6b3;
      background: none;
      border: none;
      cursor: pointer;
      margin: 8px 0;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
    }


    .btn:hover {
      color: #ffffff;
      text-shadow: 0 0 12px #d4af37, 0 0 20px #ffeb7a;
      transform: scale(1.05);
    }

    .botones {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
     <video autoplay muted loop id="bg-video">
    <source src="1759536074379video.mp4" type="video/mp4">
  </video>
  <div class="contenido">
    <h1>The Lost Kingdoms</h1>
  </div>

  <div class="botones">
    <button class="btn">Nueva Aventura</button>
    <button class="btn">Cargar Partida</button>
    <button class="btn">Ver Héroes</button>
    <button class="btn">Ver Antagonistas</button>
    <button class="btn">Opciones</button>
    <button class="btn">Salir</button>
  </div>

</body>
</html>
